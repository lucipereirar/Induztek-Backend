spring.application.name=backend
server.port=8080

# --- Base de datos MySQL ---
# La base "induztek" se crea sola si no existe.
# Usuario y contraseña se leen de variables de entorno; si no están
# definidas se usa root sin contraseña (lo normal en XAMPP/Laragon).
# Nunca escribas aquí una contraseña real: este archivo se sube a GitHub.
spring.datasource.url=jdbc:mysql://localhost:3306/induztek?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Crea y actualiza las tablas a partir de las entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
